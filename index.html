<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurveyPay | Premium Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full glass p-8 rounded-3xl shadow-2xl border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">SurveyPay</h1>
            <p class="text-slate-400 text-sm mt-2">Premium Task Access</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                <p class="text-[9px] uppercase tracking-widest text-slate-500 font-bold">Status</p>
                <h2 id="status-text" class="text-lg font-black text-red-400">PENDING</h2>
            </div>
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                <p class="text-[9px] uppercase tracking-widest text-slate-500 font-bold">Balance</p>
                <h2 id="bal-text" class="text-lg font-black text-emerald-400">0.00</h2>
            </div>
        </div>

        <button id="pay-btn" onclick="payWithPaystack()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all rounded-xl font-bold text-sm uppercase tracking-widest shadow-lg shadow-blue-900/20">
            Activate Account (180 KES)
        </button>

        <p class="text-[10px] text-center text-slate-600 mt-6 italic">Secure payments processed via Paystack</p>
    </div>

    <script>
        // Use your PUBLIC key here. This is the only key the SDK supports.
        const PUBLIC_KEY = "pk_live_ebbc4bdc1da0f8fc075bae6ce78da4f9c89552bc";

        function payWithPaystack() {
            const handler = PaystackPop.setup({
                key: PUBLIC_KEY,
                email: 'user@surveypay.com', 
                amount: 18000, // 180 KES in kobo
                currency: 'KES',
                callback: function(response) {
                    // Success logic
                    alert('Success! Transaction ID: ' + response.reference);
                    document.getElementById('status-text').innerText = "ACTIVE";
                    document.getElementById('status-text').classList.replace('text-red-400', 'text-emerald-400');
                    document.getElementById('bal-text').innerText = "180.00";
                },
                onClose: function() {
                    alert('Payment window closed.');
                }
            });
            handler.openIframe();
        }
    </script>
</body>
</html>
