<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurveyPay Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        body { background: #0b0e14; color: #fff; font-family: 'Inter', sans-serif; }
        .bg-card { background: linear-gradient(145deg, #1a1f2e, #11141c); }
        .gradient-btn { background: linear-gradient(90deg, #2563eb, #3b82f6); }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-4">

    <div id="login-view" class="max-w-sm w-full bg-card p-8 rounded-3xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-black text-center mb-2">SurveyPay</h1>
        <p class="text-slate-400 text-center text-sm mb-8">Sign in to start earning</p>
        <input type="text" id="username" placeholder="Enter Username" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-white mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
        <button onclick="handleLogin()" class="w-full py-4 gradient-btn rounded-xl font-bold text-white shadow-lg shadow-blue-900/50">JOIN NOW</button>
    </div>

    <div id="dash-view" class="hidden max-w-sm w-full space-y-6">
        <div class="bg-card p-6 rounded-3xl border border-slate-700">
            <h2 class="text-xs font-bold text-slate-500 uppercase">Available Balance</h2>
            <p id="balance-disp" class="text-4xl font-black text-emerald-400">$0.00</p>
            <button id="pay-btn" onclick="payWithPaystack(event)" class="mt-6 w-full py-4 bg-emerald-600 rounded-xl font-bold shadow-lg shadow-emerald-900/20">
                ACTIVATE ACCOUNT (KES 180)
            </button>
        </div>

        <div class="space-y-3">
            <h3 class="text-sm font-bold text-slate-400 uppercase">Surveys</h3>
            <div class="glass p-4 rounded-2xl flex justify-between items-center">
                <span>Product Feedback</span>
                <span class="text-emerald-400 font-bold">+$5.00</span>
            </div>
            <div class="glass p-4 rounded-2xl flex justify-between items-center">
                <span>Travel Habits</span>
                <span class="text-emerald-400 font-bold">+$4.50</span>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const PUBLIC_KEY = "pk_live_ebbc4bdc1da0f8fc075bae6ce78da4f9c89552bc";

        // AUTH
        function handleLogin() {
            const user = document.getElementById('username').value;
            if (user) {
                localStorage.setItem('surveypay_user', user);
                renderApp();
            }
        }

        function renderApp() {
            if (localStorage.getItem('surveypay_user')) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dash-view').classList.remove('hidden');
            }
        }

        // PAYMENT
        function payWithPaystack(event) {
            event.preventDefault(); // Prevents the browser from reloading
            
            const handler = PaystackPop.setup({
                key: PUBLIC_KEY,
                email: 'user@surveypay.com',
                amount: 180 * 100, // 180 KES
                currency: 'KES',
                callback: function(response) {
                    alert('Success! Reference: ' + response.reference);
                    document.getElementById('balance-disp').innerText = "$180.00";
                    document.getElementById('pay-btn').innerText = "ACCOUNT ACTIVE";
                    document.getElementById('pay-btn').classList.replace('bg-emerald-600', 'bg-slate-700');
                    document.getElementById('pay-btn').onclick = null;
                },
                onClose: function() {
                    console.log("Payment window closed");
                }
            });
            handler.openIframe();
        }

        // INIT
        renderApp();
    </script>
</body>
</html>
