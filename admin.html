<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SurveyPay Admin</title>
<style>:root{--bg:#f6f8f7;--card:#fff;--tx:#14211b;--mu:#5d6b63;--pr:#0a8a4a;--bd:#dbe4df;--er:#c0392b;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231d;--tx:#e8f0ec;--mu:#9aaba1;--pr:#3ccf84;--bd:#2a3a32;--er:#ff7b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}main{max-width:900px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}h1,h2{margin:.2em 0 .5em}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.k{font-size:1.4rem;font-weight:700;color:var(--pr)}.m{color:var(--mu);font-size:.85rem}
input,button{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}button{background:var(--pr);color:#fff;border:0;cursor:pointer}button.s{background:var(--bd);color:var(--tx)}.w{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}.e{color:var(--er)}</style></head><body><main>
<h1>SurveyPay Admin</h1><div class="c"><input id="t" type="password" placeholder="Admin token"> <button onclick="load()">Open</button></div><div id="o"></div></main>
<script>
let T="";const $=id=>document.getElementById(id),kes=n=>"KES "+Number(n).toLocaleString("en-KE"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,b){const r=await fetch("/admin"+p,{method:b?"POST":"GET",headers:{"x-admin-token":T,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status==401?"Wrong admin token":j.error||"Error");return j}
async function load(){T=$("t").value||T;try{const[s,l]=await Promise.all([api("/summary"),api("/surveys")]);render(s,l)}catch(e){$("o").innerHTML=`<p class="e">${esc(e.message)}</p>`}}
async function act(p,b){try{await api(p,b);load()}catch(e){alert(e.message)}}
function fund(id){const a=prompt("Amount received from the sponsor (KES):");if(a)act(`/surveys/${id}/fund`,{amount:a,note:prompt("Note (sponsor / reference):")||""})}
function add(){act("/surveys",{title:$("ti").value,type:$("ty").value,pay:$("pa").value,sponsor:$("sp").value,budget:$("bu").value})}
function render(s,l){const K=(a,b,n)=>`<div class="c"><div class="m">${a}</div><div class="k" ${n?'style="color:var(--er)"':""}>${b}</div></div>`;
$("o").innerHTML=`<h2>Money</h2><div class="g">${K("Activation revenue",kes(s.activationRevenue))}${K("Sponsor funding recorded",kes(s.sponsorFunding))}${K("Owed to users (balances + processing)",kes(s.owedToUsers))}${K("Paid out to users",kes(s.withdrawalsPaid))}${K("Indicative surplus",kes(s.indicativeSurplus),s.indicativeSurplus<0)}${K("Sponsor budget left",kes(s.sponsorBudgetLeft))}${K("Users",s.users)}</div>
<p class="m">Surplus = activation revenue + recorded sponsor funding - paid out - owed. Compare "owed" with your real B2C balance in the Daraja portal before approving growth.</p>
<h2>Add survey</h2><div class="c g"><input id="ti" placeholder="Title"><input id="ty" placeholder="Type (e.g. Finance)"><input id="pa" type="number" placeholder="Pay per user (KES)"><input id="sp" placeholder="Sponsor name"><input id="bu" type="number" placeholder="Sponsor budget received (KES)"><button onclick="add()">Create</button></div>
<h2>Surveys</h2><div class="c w"><table><tr><th>Title</th><th>Sponsor</th><th>Pay</th><th>Budget left</th><th>Status</th><th></th></tr>${l.map(x=>{const left=x.budget-x.spent,live=x.active&&left>=x.pay;return `<tr><td>${esc(x.title)}</td><td>${esc(x.sponsor)}</td><td>${kes(x.pay)}</td><td>${kes(left)}</td><td>${live?"Live":x.active?"Needs funding":"Paused"}</td><td><button onclick="fund(${x.id})">Add funds</button> <button class="s" onclick="act('/surveys/${x.id}/toggle',{})">${x.active?"Pause":"Resume"}</button></td></tr>`}).join("")}</table></div>`}
</script></body></html>
