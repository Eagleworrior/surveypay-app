<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurveyPay — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/survey-core/defaultV2.min.css" rel="stylesheet"/>
    <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-knockout/survey.ko.min.js"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background: #05010d; font-family: 'Inter', sans-serif; color: #fff; }
        .glass { background: rgba(15, 7, 36, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { color: #00d2ff !important; border-bottom: 2px solid #00d2ff; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col relative">

    <section id="view-auth" class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="glass w-full p-8 rounded-3xl text-center shadow-2xl">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-2">SurveyPay</h1>
            <p class="text-gray-400 text-xs mb-8 uppercase tracking-widest font-bold">Global Data Ecosystem</p>
            
            <div id="reg-form" class="space-y-4 text-left">
                <input id="in-name" type="text" placeholder="Full Name" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white">
                <select id="in-country" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-gray-300">
                    <option value="KE">Kenya (KES)</option>
                    <option value="NG">Nigeria (NGN)</option>
                    <option value="US">USA (USD)</option>
                </select>
                <button onclick="registerUser()" class="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 rounded-xl font-black text-white">CREATE ACCOUNT</button>
                <button onclick="toggleAuth()" class="w-full text-xs text-gray-500 font-bold underline">Already have an account? Login</button>
            </div>

            <div id="login-form" class="hidden space-y-4 text-left">
                <input id="in-login-name" type="text" placeholder="Enter Full Name" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white">
                <button onclick="loginUser()" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-700 rounded-xl font-black text-white">LOGIN</button>
            </div>
        </div>
    </section>

    <div id="view-main" class="hidden flex-1 flex flex-col">
        <header class="p-6 flex justify-between items-center bg-black/20">
            <div>
                <h2 id="disp-name" class="text-lg font-black text-white"></h2>
                <p id="disp-currency" class="text-[10px] font-bold text-cyan-400 uppercase tracking-wider"></p>
            </div>
            <div class="text-right">
                <p class="text-[9px] text-gray-500 font-black uppercase">Balance</p>
                <h2 id="disp-balance" class="text-xl font-black text-emerald-400">0.00</h2>
            </div>
        </header>

        <main class="flex-1 px-6 pb-24 space-y-6 overflow-y-auto">
            <section id="content-home" class="space-y-4">
                <div class="glass p-5 rounded-2xl border-l-4 border-purple-500">
                    <p class="text-[10px] text-purple-400 font-black uppercase">Account Status</p>
                    <h3 id="status-text" class="text-sm font-bold">Unactivated</h3>
                    <button id="activate-btn" onclick="openUnlockModal()" class="mt-3 w-full bg-purple-600 py-2 rounded-lg text-xs font-bold">ACTIVATE NOW</button>
                </div>
                <h3 class="text-xs font-black text-gray-500 uppercase">Featured Surveys</h3>
                <div id="survey-list" class="space-y-3"></div>
            </section>

            <section id="content-wallet" class="hidden space-y-4">
                <div class="glass p-8 rounded-3xl text-center border-t border-emerald-500">
                    <p class="text-gray-400 text-xs font-bold uppercase">Total Earned</p>
                    <h1 id="wallet-balance" class="text-5xl font-black text-emerald-400 my-4">0.00</h1>
                    <button onclick="withdraw()" class="w-full bg-emerald-600 py-4 rounded-xl font-black">WITHDRAW FUNDS</button>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 w-full glass border-t border-white/10 flex justify-around p-4 z-50">
            <button onclick="setTab('home')" class="text-xs font-black uppercase text-gray-400 flex flex-col items-center"><i class="fa fa-home"></i>Home</button>
            <button onclick="setTab('wallet')" class="text-xs font-black uppercase text-gray-400 flex flex-col items-center"><i class="fa fa-wallet"></i>Wallet</button>
        </nav>
    </div>

    <div id="modal-unlock" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-6">
        <div class="glass w-full p-6 rounded-3xl text-center">
            <h2 class="text-xl font-black mb-4">Unlock Premium</h2>
            <button onclick="payWithPaystack()" class="w-full bg-cyan-600 py-4 rounded-xl font-bold">PAY WITH CARD</button>
            <button onclick="closeModal()" class="mt-4 text-gray-500 font-bold text-sm">Cancel</button>
        </div>
    </div>

    <script>
        // CONFIG & STATE
        const currencyMap = { 'KE': { sym: 'KSh', rate: 1 }, 'NG': { sym: '₦', rate: 11.5 }, 'US': { sym: '$', rate: 0.0076 } };
        let user = JSON.parse(localStorage.getItem('user_data'));

        // APP INIT
        function init() {
            if (user) {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-main').classList.remove('hidden');
                renderDashboard();
            }
        }

        // AUTH
        function registerUser() {
            const name = document.getElementById('in-name').value;
            const country = document.getElementById('in-country').value;
            if(!name) return alert('Enter name');
            user = { name, country, balance: 0, unlocked: false };
            localStorage.setItem('user_data', JSON.stringify(user));
            location.reload();
        }

        function loginUser() {
            const name = document.getElementById('in-login-name').value;
            if(user && user.name === name) {
                location.reload();
            } else { alert('User not found'); }
        }

        function toggleAuth() {
            document.getElementById('reg-form').classList.toggle('hidden');
            document.getElementById('login-form').classList.toggle('hidden');
        }

        // DASHBOARD LOGIC
        function renderDashboard() {
            const cur = currencyMap[user.country];
            const bal = (user.balance * cur.rate).toLocaleString();
            document.getElementById('disp-name').innerText = user.name;
            document.getElementById('disp-currency').innerText = user.country;
            document.getElementById('disp-balance').innerText = cur.sym + ' ' + bal;
            document.getElementById('wallet-balance').innerText = cur.sym + ' ' + bal;
            document.getElementById('status-text').innerText = user.unlocked ? 'Account Active' : 'Account Inactive';
            if(user.unlocked) document.getElementById('activate-btn').classList.add('hidden');
        }

        function setTab(tab) {
            document.getElementById('content-home').classList.toggle('hidden', tab !== 'home');
            document.getElementById('content-wallet').classList.toggle('hidden', tab !== 'wallet');
        }

        // PAYMENTS
        function openUnlockModal() { document.getElementById('modal-unlock').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal-unlock').classList.add('hidden'); }

        function payWithPaystack() {
            let handler = PaystackPop.setup({
                key: 'pk_test_YOUR_KEY', // Replace with your Public Key
                email: 'user@example.com',
                amount: 18000, 
                currency: 'KES',
                callback: function(response) {
                    user.unlocked = true;
                    localStorage.setItem('user_data', JSON.stringify(user));
                    location.reload();
                }
            });
            handler.openIframe();
        }

        function withdraw() { alert("Withdrawal processed for " + user.name); }

        init();
    </script>
</body>
</html>
