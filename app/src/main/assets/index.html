<body>
<main id="app"></main>
<div id="nav"></div>

<script>
let tk = localStorage.getItem("sp_tk") || "";
const setTk = t => { tk = t || ""; if (t) localStorage.setItem("sp_tk", t); else localStorage.removeItem("sp_tk"); };

const META = [
  ["📱", "#38bdf8"], ["🛍️", "#f472b6"], ["🩺", "#f43f5e"], ["🎬", "#c084fc"],
  ["🚌", "#fb923c"], ["🎓", "#60a5fa"], ["🍔", "#f97316"], ["📲", "#2dd4bf"],
  ["🌽", "#34d399"], ["💡", "#facc15"], ["💬", "#818cf8"], ["💼", "#94a3b8"]
];

const BANKS = ["KCB Bank", "Equity Bank", "Co-operative Bank", "Absa Bank Kenya", "Standard Chartered", "NCBA Bank", "Stanbic Bank", "I&M Bank", "Family Bank"].sort();

let S = { user: null, done: 0, cfg: { activationFee: 200, freeSurveys: 3, minWithdraw: 500 }, list: [], h: { surveys: [], withdrawals: [] } };
let page = "earn", mode = "signup", run = null, err = "", wdOK = null, modal = null, wm = "mpesa", loading = false, hist = "s";

const kes = n => "KES " + Number(n).toLocaleString("en-KE");
const $ = id => document.getElementById(id);

const normPhone = p => {
  const s = String(p || "").replace(/[\s+]/g, "");
  return /^(254|0)[17]\d{8}$/.test(s) ? "254" + s.replace(/^(254|0)/, "") : null;
};

async function api(p, body) {
  try {
    const r = await fetch("/api" + p, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json", ...(tk ? { Authorization: "Bearer " + tk } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (r.status === 401 && tk) { setTk(null); S.user = null; draw(); }
    if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong."), { data: j });
    return j;
  } catch (err) {
    console.warn("API fetch failed, using local storage fallback simulator for:", p);
    return simulateApiLocally(p, body);
  }
}

function simulateApiLocally(p, body) {
  let users = JSON.parse(localStorage.getItem("sp_local_users") || "[]");
  let currentUserEmail = localStorage.getItem("sp_local_session") || "";

  if (p === "/config") {
    return { activationFee: 200, freeSurveys: 3, minWithdraw: 500 };
  }
  if (p === "/signup") {
    const { name, email, phone, password } = body || {};
    if (!name || !email || !phone || !password) throw new Error("All fields are required.");
    if (users.find(u => u.email === email)) throw new Error("An account with this email already exists.");
    const newUser = { id: Date.now(), name, email, phone, password, balance: 0, active: 0 };
    users.push(newUser);
    localStorage.setItem("sp_local_users", JSON.stringify(users));
    localStorage.setItem("sp_local_session", email);
    return { token: "local_token_" + newUser.id, user: { name, email, phone, balance: 0, active: false } };
  }
  if (p === "/login") {
    const { email, password } = body || {};
    const u = users.find(x => x.email === email && x.password === password);
    if (!u) throw new Error("Wrong email or password.");
    localStorage.setItem("sp_local_session", email);
    return { token: "local_token_" + u.id, user: { name: u.name, email: u.email, phone: u.phone, balance: u.balance, active: !!u.active } };
  }
  if (p === "/me") {
    const u = users.find(x => x.email === currentUserEmail) || users[0];
    if (!u) throw new Error("Not logged in");
    const completions = JSON.parse(localStorage.getItem("sp_local_completions_" + u.id) || "[]");
    return { user: { name: u.name, email: u.email, phone: u.phone, balance: u.balance, active: !!u.active }, surveysDone: completions.length };
  }
  if (p === "/surveys") {
    const u = users.find(x => x.email === currentUserEmail) || users[0];
    const completions = u ? JSON.parse(localStorage.getItem("sp_local_completions_" + u.id) || "[]") : [];
    const doneIds = new Set(completions.map(c => c.survey_id));

    const surveyList = [
      { id: 1, title: "Mobile Money Usage Survey", type: "Finance", pay: 120, questions: 50 },
      { id: 2, title: "Online Shopping Habits Survey", type: "Retail", pay: 120, questions: 50 },
      { id: 3, title: "Healthcare Access & Insurance Survey", type: "Health", pay: 120, questions: 50 },
      { id: 4, title: "Streaming & Entertainment Survey", type: "Media", pay: 120, questions: 50 },
      { id: 5, title: "Public Transport & Commute Survey", type: "Transport", pay: 120, questions: 50 },
      { id: 6, title: "Education & Digital Skills Survey", type: "Education", pay: 120, questions: 50 },
      { id: 7, title: "Food & Dining Preferences Survey", type: "Lifestyle", pay: 120, questions: 50 },
      { id: 8, title: "Smartphone & Gadgets Usage Survey", type: "Technology", pay: 120, questions: 50 },
      { id: 9, title: "Farming & Agribusiness Survey", type: "Agriculture", pay: 120, questions: 50 },
      { id: 10, title: "Energy & Home Utilities Survey", type: "Utilities", pay: 120, questions: 50 },
      { id: 11, title: "Social Media & News Survey", type: "Media", pay: 120, questions: 50 },
      { id: 12, title: "Small Business & Entrepreneurship Survey", type: "Business", pay: 120, questions: 50 }
    ];

    return surveyList.map(s => ({ ...s, done: doneIds.has(s.id) }));
  }
  if (p.startsWith("/surveys/") && p.endsWith("/questions")) {
    const sId = parseInt(p.split("/")[2]);
    const topics = [
      { name: "Finance & Mobile Money", sub: ["transaction fees", "wallet security", "transfer speeds", "savings features", "loan access", "customer support", "app interface", "biometric login", "merchant payments", "budgeting tools"] },
      { name: "Retail & Online Shopping", sub: ["delivery speed", "product quality", "payment options", "return policy", "customer service", "discount offers", "app usability", "seller trust", "packaging", "order tracking"] },
      { name: "Healthcare & Insurance", sub: ["consultation cost", "insurance coverage", "digital booking", "pharmacy delivery", "telehealth quality", "claim processing", "hospital proximity", "specialist availability", "wellness tracking", "customer transparency"] }
    ];
    const topic = topics[(sId - 1) % topics.length];

    const qs = [];
    const questionTemplates = [
      (sub, n) => ({ q: `When evaluating ${sub} within ${topic.name}, what factor influences your decision the most?`, c: [`Superior reliability and consistent uptime`, `Transparent pricing with zero hidden charges`, `Advanced security protocols and encryption`, `Responsive 24/7 customer assistance`] }),
      (sub, n) => ({ q: `How would you rate your overall satisfaction regarding ${sub} over the past 6 months?`, c: [`Consistently exceeds expectations`, `Generally satisfactory with minor flaws`, `Needs noticeable improvements in performance`, `Frequently encounters technical bottlenecks`] }),
      (sub, n) => ({ q: `What primary challenge do you face when interacting with ${sub}?`, c: [`High operational service costs`, `Complex navigation and cluttered menus`, `Delayed response times from support teams`, `Inconsistent network connectivity or sync issues`] }),
      (sub, n) => ({ q: `Which new feature or enhancement would add the most value to ${sub}?`, c: [`Faster automated processing speeds`, `Enhanced personalization and customized dashboards`, `Lower fees and loyalty rewards programs`, `Comprehensive offline functionality mode`] }),
      (sub, n) => ({ q: `How frequently do you recommend services related to ${sub} to colleagues or friends?`, c: [`Frequently recommend to peers`, `Occasionally share when asked directly`, `Rarely discuss unless prompted`, `Never recommend to others`] })
    ];

    let qIndex = 1;
    while (qs.length < 50) {
      const sub = topic.sub[(qIndex - 1) % topic.sub.length];
      const templateFn = questionTemplates[(qIndex - 1) % questionTemplates.length];
      const generated = templateFn(sub, qIndex);
      qs.push({
        q: `[${topic.name}] Q${qIndex}: ${generated.q}`,
        c: generated.c
      });
      qIndex++;
    }

    return { title: `${topic.name} Survey`, pay: 120, questions: qs };
  }
  if (p.startsWith("/surveys/") && p.endsWith("/submit")) {
    const sId = parseInt(p.split("/")[2]);
    const u = users.find(x => x.email === currentUserEmail) || users[0];
    if (u) {
      let comp = JSON.parse(localStorage.getItem("sp_local_completions_" + u.id) || "[]");
      if (comp.some(c => c.survey_id === sId)) throw new Error("You have already completed this survey. No repeating allowed.");

      if (comp.length >= 3 && !u.active) {
        throw new Error("You have completed your 3 free surveys! Please pay the 200 KES activation fee to unlock remaining surveys.");
      }

      u.balance += 120;
      comp.push({ survey_id: sId, amount: 120, t: Date.now() });
      localStorage.setItem("sp_local_users", JSON.stringify(users));
      localStorage.setItem("sp_local_completions_" + u.id, JSON.stringify(comp));
    }
    return { earned: 120, balance: u ? u.balance : 120 };
  }
  if (p === "/activate") {
    const u = users.find(x => x.email === currentUserEmail) || users[0];
    if (u) {
      u.active = 1;
      localStorage.setItem("sp_local_users", JSON.stringify(users));
    }
    return { message: "Account Activated Successfully!", checkoutId: "local_chk_" + Date.now() };
  }
  if (p.startsWith("/activate/status/")) {
    return { status: "paid", message: "Account Activated Successfully!" };
  }
  if (p === "/withdraw") {
    const { amount } = body || {};
    const amt = Math.floor(+amount);
    const u = users.find(x => x.email === currentUserEmail) || users[0];
    if (!u) throw new Error("Not logged in");
    if (!amt || amt < 500) throw new Error("Minimum withdrawal amount is KES 500.");
    if (amt > u.balance) throw new Error("Amount is more than your available balance.");
    u.balance -= amt;
    localStorage.setItem("sp_local_users", JSON.stringify(users));

    let wd = JSON.parse(localStorage.getItem("sp_local_withdrawals_" + u.id) || "[]");
    wd.push({ amount: amt, dest: "M-Pesa +" + u.phone, status: "Successful", t: Date.now() });
    localStorage.setItem("sp_local_withdrawals_" + u.id, JSON.stringify(wd));

    return { ok: true, message: `Successfully withdrew KES ${amt.toLocaleString()}. Amount deducted from your balance.` };
  }
  if (p === "/history") {
    const u = users.find(x => x.email === currentUserEmail) || users[0];
    const comp = u ? JSON.parse(localStorage.getItem("sp_local_completions_" + u.id) || "[]") : [];
    const wd = u ? JSON.parse(localStorage.getItem("sp_local_withdrawals_" + u.id) || "[]") : [];
    return {
      surveys: comp.map(c => ({ id: c.survey_id, title: `Market Research Survey #${c.survey_id}`, amount: c.amount, t: c.t })),
      withdrawals: wd
    };
  }
  return {};
}

function nav(p) { page = p; run = null; wdOK = null; err = ""; modal = null; load(); }

async function load() {
  loading = true;
  if (S.user) {
    try {
      const m = await api("/me");
      S.user = m.user; S.done = m.surveysDone;
      if (page === "earn") S.list = await api("/surveys");
      if (page === "balance" || page === "history") S.h = await api("/history");
    } catch (e) {
      S.user = null;
      setTk(null);
    }
  }
  loading = false;
  draw();
}

function draw() {
  const u = S.user;
  if (!u) {
    $("app").innerHTML = authV();
    $("nav").innerHTML = "";
    return;
  }

  const P = { profile: profileV, earn: earnV, balance: balV, history: histV, withdraw: wdV };
  $("app").innerHTML = `
    <div class="text-center pt-2 pb-3 mb-2 border-b border-slate-800/80">
      <b class="title-gradient text-2xl font-black">💸 SurveyPay</b>
    </div>
    ${run ? runV() : loading ? '<p class="mu text-center py-8 text-cyan-400 font-extrabold">Loading dashboard...</p>' : P[page]()}
    ${modal || ""}
  `;

  // Professional Boxed Bottom Navigation
  const t = [
    ["earn", "<i class='fa-solid fa-list-check text-emerald-400 text-base block mb-1'></i><span style='color:#34d399'>Earn</span>"],
    ["profile", "<i class='fa-solid fa-user text-cyan-400 text-base block mb-1'></i><span style='color:#38bdf8'>Me</span>"],
    ["balance", "<i class='fa-solid fa-wallet text-amber-400 text-base block mb-1'></i><span style='color:#fbbf24'>Balance</span>"],
    ["history", "<i class='fa-solid fa-clock-rotate-left text-purple-400 text-base block mb-1'></i><span style='color:#c084fc'>History</span>"],
    ["withdraw", "<i class='fa-solid fa-money-bill-transfer text-rose-400 text-base block mb-1'></i><span style='color:#fb7185'>Withdraw</span>"]
  ];

  $("nav").innerHTML = '<div class="nav">' + t.map(x => `<button class="${page === x[0] ? "on" : ""}" onclick="nav('${x[0]}')">${x[1]}</button>`).join("") + '</div>';
</script>
</body>
</html>
